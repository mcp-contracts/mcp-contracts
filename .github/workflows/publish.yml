name: Publish to npm & GitHub Packages

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm biome check .

      - run: pnpm -r build

      - run: pnpm -r typecheck

      - run: pnpm -r test

      # Each publish step skips versions that already exist so that a re-run
      # after a partial failure only publishes what is still missing.
      - name: Publish @mcp-contracts/core to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@mcp-contracts/core@$VERSION" version >/dev/null 2>&1; then
            echo "@mcp-contracts/core@$VERSION already published — skipping"
          else
            pnpm pack
            TARBALL="mcp-contracts-core-$VERSION.tgz"
            test -f "$TARBALL" || { echo "expected $TARBALL from pnpm pack"; ls *.tgz; exit 1; }
            npm publish "$TARBALL" --access public --provenance
          fi
        working-directory: packages/core

      - name: Publish @mcp-contracts/cli to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@mcp-contracts/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@mcp-contracts/cli@$VERSION already published — skipping"
          else
            pnpm pack
            TARBALL="mcp-contracts-cli-$VERSION.tgz"
            test -f "$TARBALL" || { echo "expected $TARBALL from pnpm pack"; ls *.tgz; exit 1; }
            npm publish "$TARBALL" --access public --provenance
          fi
        working-directory: packages/cli

      - name: Publish @mcp-contracts/test to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@mcp-contracts/test@$VERSION" version >/dev/null 2>&1; then
            echo "@mcp-contracts/test@$VERSION already published — skipping"
          else
            pnpm pack
            TARBALL="mcp-contracts-test-$VERSION.tgz"
            test -f "$TARBALL" || { echo "expected $TARBALL from pnpm pack"; ls *.tgz; exit 1; }
            npm publish "$TARBALL" --access public --provenance
          fi
        working-directory: packages/test

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@mcp-contracts'

      - name: Publish to GitHub Packages
        run: pnpm -r publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
