name: Release Notes

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read

jobs:
  notes:
    runs-on: ubuntu-latest
    steps:
      - uses: lukekania/generate-release-notes@7a5fb2f90238819f447aac3a0bbf6a8344253e14 # v0.4.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          use_conventional_commits: true
          draft: "false"
          draft: false
