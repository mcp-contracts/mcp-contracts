version: 2
updates:
  # All npm dependencies (root + workspace packages)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      all-dependencies:
        patterns:
          - "*"
    ignore:
      # tsup's dts build does not support the TypeScript 7 (native) compiler yet
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      all-actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "lukekania/generate-release-notes"
